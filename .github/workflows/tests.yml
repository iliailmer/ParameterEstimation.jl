name: "Tests"
on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "Project.toml"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "test/**"
      - "Project.toml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: write
  contents: read
jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1", "lts"]
        os: [macos-latest, ubuntu-latest]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
      - name: "Setup Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: "Cache Julia depot"
        uses: julia-actions/cache@v3
      - name: "Build Package"
        uses: julia-actions/julia-buildpkg@v1
      - name: "Run tests"
        uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
